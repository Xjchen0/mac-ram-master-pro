name: Release Build

on:
  push:
    tags:
      - 'v*' # 当推送以 v 开头的标签时触发，例如 v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 打包前的冒烟检查：主进程入口与渲染层 HTML 必须都真实落盘。
      # 之前 loadFile 指向的路径与 Vite 实际产物对不上，构建照样成功、
      # 发布出去的却是白屏窗口 —— 光看构建退出码永远发现不了。
      - name: Verify Build Artifacts
        run: |
          test -f dist/main/main.js
          test -f dist/main/preload.js
          test -f dist/renderer/index.html

      - name: Package and Publish Release
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
