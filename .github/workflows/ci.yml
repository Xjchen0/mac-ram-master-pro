name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 全部测试都基于文本 fixture（tests/fixtures/vm-stat-样本.ts），
# 不执行 vm_stat / sysctl / purge 等任何 macOS 命令，所以 ubuntu runner 足够，
# 无需为一次类型检查加测试排队等 macOS 机器。
jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # 测试不启动 Electron，跳过约 100MB 的二进制下载
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
