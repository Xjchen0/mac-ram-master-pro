name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 全部测试都基于文本 fixture（tests/fixtures/vm-stat-样本.ts）和 ink-testing-library 的假 stdout，
# 不执行 vm_stat / sysctl / purge 等任何 macOS 命令，所以 ubuntu runner 足够，
# 无需为一次类型检查加测试排队等 macOS 机器。
jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Ink 8 与 Vitest 5 都要求 Node >= 22（Vitest 5 实际下限是 22.12）
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/cli.js
          test -f dist/App.js
          test -f dist/memory-stats.js
          # bin 入口必须保留 shebang，否则 npm 链接出来的 ram-master 无法直接执行
          head -1 dist/cli.js | grep -q '^#!/usr/bin/env node$'
